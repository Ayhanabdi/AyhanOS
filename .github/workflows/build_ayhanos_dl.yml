name: AyhanOSDL Build

on:
  push:
    paths:
      - 'ayhanos_dl.c'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # نصب تمام کتابخانه‌های مورد نیاز برای لینک استاتیک libcurl
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libkrb5-dev libldap2-dev zlib1g-dev libpsl-dev libbrotli-dev

      - name: Compile AyhanOSDL (Static)
        run: |
          # کامپایل با لینک کردن تمام کتابخانه‌های وابسته
          gcc -static ayhanos_dl.c -o ayhanos_dl \
            -lcurl -lssl -lcrypto \
            -lkrb5 -lgssapi_krb5 -lldap -llber \
            -lz -lpsl -lbrotlidec -lbrotlicommon

      - name: Verify Static Linking
        run: |
          file ayhanos_dl
          ldd ayhanos_dl || true

      - name: Upload AyhanOSDL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyhanOSDL-x86_64
          path: ayhanos_dl
