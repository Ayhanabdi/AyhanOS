name: AyhanOSDL Build

on:
  push:
    paths:
      - 'ayhanos_dl.c'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev wget

      - name: Compile libcurl (Static, OpenSSL)
        run: |
          wget https://curl.se/download/curl-8.11.0.tar.gz
          tar -xzf curl-8.11.0.tar.gz
          cd curl-8.11.0
          ./configure \
            --disable-shared \
            --enable-static \
            --with-openssl \
            --without-libpsl \
            --without-brotli \
            --without-zstd \
            --without-libidn2 \
            --without-librtmp \
            --without-nghttp2 \
            --without-ngtcp2 \
            --disable-ldap \
            --disable-ldaps \
            --disable-ftp \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smb \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-kerberos-auth \
            --disable-negotiate-auth \
            --disable-ntlm
          make -j$(nproc)
          sudo make install

      - name: Compile AyhanOSDL
        run: |
          gcc -static ayhanos_dl.c -o ayhanos_dl -lcurl -lssl -lcrypto -lz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyhanOSDL-x86_64
          path: ayhanos_dl
