name: AyhanOSDL Build

on:
  push:
    paths:
      - 'ayhanos_dl.c'
  workflow_dispatch: # اجازه اجرای دستی

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Compile AyhanOSDL (Static)
        run: |
          # کامپایل استاتیک برای x86_64
          # لینک کردن کتابخانه‌های curl و ssl به صورت استاتیک
          gcc -static ayhanos_dl.c -o ayhanos_dl -lcurl -lssl -lcrypto

      - name: Upload AyhanOSDL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyhanOSDL-x86_64
          path: ayhanos_dl
