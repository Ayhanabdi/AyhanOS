name: Build AyhanOS Kernel with SELinux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc wget xz-utils cpio

      - name: Download Tiny Core Kernel Source and Config
        run: |
          set -e
          wget -q --timeout=60 --tries=3 http://repo.tinycorelinux.net/17.x/x86/release/src/kernel/linux-6.18.2-patched.tar.xz || \
          wget -q --timeout=60 --tries=3 http://repo.tinycorelinux.net/17.x/x86/release/src/kernel/linux-6.18.2.tar.xz
          
          wget -q --timeout=60 --tries=2 http://repo.tinycorelinux.net/17.x/x86/release/src/kernel/config-6.18.2-tinycore || true
          
          tar -xf linux-6.18.2*.tar.xz
          cd linux-6.18.2
          
          if [ -f "../config-6.18.2-tinycore" ]; then
            cp ../config-6.18.2-tinycore .config
          else
            make defconfig
          fi
          
          make oldconfig < /dev/null

      - name: Enable SELinux and Disable Problematic Drivers
        run: |
          cd linux-6.18.2
          scripts/config --enable SECURITY_SELINUX
          scripts/config --enable SECURITY_SELINUX_BOOTPARAM
          scripts/config --enable SECURITY_SELINUX_DEVELOP
          scripts/config --enable SECURITY
          scripts/config --enable SECURITY_NETWORK
          scripts/config --enable AUDIT
          scripts/config --enable EXT4_FS_SECURITY
          scripts/config --set-str DEFAULT_SECURITY "selinux"
          
          scripts/config --disable NVRAM
          scripts/config --disable RTC
          scripts/config --disable RTC_CLASS
          scripts/config --disable RTC_HCTOSYS
          scripts/config --disable RTC_SYSTOHC
          
          make olddefconfig

      - name: Compile Kernel
        run: |
          cd linux-6.18.2
          make -j$(nproc) bzImage
          make -j$(nproc) modules

      - name: Package Output for Tiny Core
        run: |
          cd linux-6.18.2
          cp arch/x86/boot/bzImage ../vmlinuz-selinux
          
          mkdir -p ../modules_out
          make INSTALL_MOD_PATH=../modules_out modules_install
          
          KERNEL_VERSION=$(make kernelrelease)
          echo "Kernel Version is: $KERNEL_VERSION"
          
          cd ../modules_out/lib/modules/$KERNEL_VERSION
          find . -name "*.ko" -exec gzip -9 {} \;
          
          ln -sf kernel kernel.tclocal
          
          cd ..
          depmod -b ../.. $KERNEL_VERSION
          
          cd $KERNEL_VERSION
          
          tar -czf ../../../../modules-selinux.tar.gz -C . .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ayhanos-selinux-kernel
          path: |
            vmlinuz-selinux
            modules-selinux.tar.gz
