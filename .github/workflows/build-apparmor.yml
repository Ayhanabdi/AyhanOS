name: Build AppArmor Parser with Alpine Musl (Ultimate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: alpine:latest
    steps:
      - name: Install Build Dependencies in Alpine
        run: |
          apk update
          apk add --no-cache \
            build-base \
            bison \
            flex \
            openssl-dev \
            elfutils-dev \
            pcre2-dev \
            pkgconfig \
            gettext-dev \
            python3-dev \
            swig \
            libtool \
            automake \
            autoconf \
            autoconf-archive \
            wget \
            tar \
            patch

      - name: Download AppArmor Source
        run: |
          wget -q https://gitlab.com/apparmor/apparmor/-/archive/v4.1.6/apparmor-v4.1.6.tar.gz
          tar -xzf apparmor-v4.1.6.tar.gz
          cd apparmor-v4.1.6

      - name: Apply Musl Compatibility Patch
        run: |
          cd apparmor-v4.1.6
          # دانلود و اعمال پچ رسمی Alpine برای سازگاری با musl
          # این پچ مشکل تولید اشتباه af_protos.h را حل می‌کند
          wget -q -O /tmp/fix-musl.patch "https://git.alpinelinux.org/aports/plain/main/apparmor/0001-Fix-linking-against-gettext-on-musl-libc.patch?h=master" || true
          
          # اگر پچ دانلود نشد، خودمان فایل را اصلاح می‌کنیم (راه‌حل جایگزین)
          # این دستور از تولید UIPPROTO جلوگیری می‌کند
          sed -i 's/AA_GEN_PROTO_ENT(\\\\UIPPROTO_/AA_GEN_PROTO_ENT(IPPROTO_/g' libraries/libapparmor/src/Makefile.am 2>/dev/null || true
          
          # اعمال پچ اگر وجود دارد
          if [ -f /tmp/fix-musl.patch ]; then
            patch -p1 < /tmp/fix-musl.patch || echo "Patch already applied or failed, continuing..."
          fi

      - name: Build libapparmor
        run: |
          cd apparmor-v4.1.6/libraries/libapparmor
          ./autogen.sh
          ./configure --prefix=/usr --enable-static --disable-shared --disable-nls
          make -j$(nproc)
          make install

      - name: Build apparmor_parser (Fully Static)
        run: |
          cd apparmor-v4.1.6/parser
          make clean
          make -j$(nproc) WITH_STATIC_LINKING=1
          make install WITH_STATIC_LINKING=1

      - name: Package Output for Tiny Core
        run: |
          mkdir -p /tmp/apparmor-out
          cp -a /usr/sbin/apparmor_parser /tmp/apparmor-out/ 2>/dev/null || true
          
          echo "=== Checking for glibc dependencies ==="
          strings /usr/sbin/apparmor_parser | grep "ld-linux" && echo "WARNING: Still linked to glibc!" || echo "SUCCESS: No glibc dependency found!"
          
          cd /tmp/apparmor-out
          tar -czf /tmp/apparmor-alpine-final.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apparmor-alpine-final
          path: /tmp/apparmor-alpine-final.tar.gz
