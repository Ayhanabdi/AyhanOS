name: Build AppArmor Parser with Alpine Musl (Ultimate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: alpine:latest
    steps:
      - name: Install Build Dependencies in Alpine
        run: |
          apk update
          apk add --no-cache \
            build-base \
            bison \
            flex \
            openssl-dev \
            elfutils-dev \
            pcre2-dev \
            pkgconfig \
            gettext-dev \
            python3-dev \
            swig \
            libtool \
            automake \
            autoconf \
            autoconf-archive \
            wget \
            tar \
            patch \
            linux-headers \
            sed \
            git

      - name: Clone AppArmor Source (with all helper scripts)
        run: |
          # استفاده از git clone برای دریافت کامل مخزن (شامل پوشه common)
          git clone --depth 1 --branch v4.1.6 https://gitlab.com/apparmor/apparmor.git
          cd apparmor
          
          # بررسی وجود پوشه common
          ls -la common/

      - name: Fix musl compatibility
        run: |
          cd apparmor
          # اصلاح دستور sed برای musl
          sed -i 's/\\UIPPROTO_/IPPROTO_/g' libraries/libapparmor/src/Makefile.am
          sed -i 's/\\L\\1/\\1/g' libraries/libapparmor/src/Makefile.am

      - name: Build libapparmor
        run: |
          cd apparmor/libraries/libapparmor
          ./autogen.sh
          ./configure --prefix=/usr --enable-static --disable-shared --disable-nls
          make -j$(nproc)
          make install

      - name: Build apparmor_parser (Fully Static)
        run: |
          cd apparmor/parser
          make clean
          make -j$(nproc) WITH_STATIC_LINKING=1
          make install WITH_STATIC_LINKING=1

      - name: Package Output for Tiny Core
        run: |
          mkdir -p /tmp/apparmor-out
          cp -a /usr/sbin/apparmor_parser /tmp/apparmor-out/ 2>/dev/null || true
          
          echo "=== Checking for glibc dependencies ==="
          strings /usr/sbin/apparmor_parser | grep "ld-linux" && echo "WARNING: Still linked to glibc!" || echo "SUCCESS: No glibc dependency found!"
          
          cd /tmp/apparmor-out
          tar -czf /tmp/apparmor-alpine-final.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apparmor-alpine-final
          path: /tmp/apparmor-alpine-final.tar.gz
