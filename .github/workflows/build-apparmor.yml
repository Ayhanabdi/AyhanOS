name: Build AppArmor Parser with Musl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev libpcre2-dev pkg-config gettext python3-dev swig libtool automake autoconf autoconf-archive musl-tools

      - name: Download AppArmor Source
        run: |
          wget -q https://gitlab.com/apparmor/apparmor/-/archive/v4.1.6/apparmor-v4.1.6.tar.gz
          tar -xzf apparmor-v4.1.6.tar.gz
          cd apparmor-v4.1.6

      - name: Build libapparmor with Musl
        run: |
          cd apparmor-v4.1.6/libraries/libapparmor
          ./autogen.sh
          CC=musl-gcc ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) CC=musl-gcc
          sudo make install

      - name: Build apparmor_parser with Musl
        run: |
          cd apparmor-v4.1.6/parser
          make clean
          # فقط از WITH_STATIC_LINKING استفاده کنید
          make -j$(nproc) CC=musl-gcc WITH_STATIC_LINKING=1
          sudo make install CC=musl-gcc WITH_STATIC_LINKING=1

      - name: Package Output for Tiny Core
        run: |
          mkdir -p /tmp/apparmor-out
          sudo cp -a /usr/sbin/apparmor_parser /tmp/apparmor-out/ 2>/dev/null || true
          sudo cp -a /usr/lib/libapparmor* /tmp/apparmor-out/ 2>/dev/null || true
          
          cd /tmp/apparmor-out
          tar -czf /tmp/apparmor-musl.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apparmor-musl
          path: /tmp/apparmor-musl.tar.gz
