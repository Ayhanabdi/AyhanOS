name: Build AppArmor Userspace Fully Static for Tiny Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev libpcre2-dev pkg-config gettext python3-dev swig libtool automake autoconf autoconf-archive

      - name: Download AppArmor Source
        run: |
          wget -q https://gitlab.com/apparmor/apparmor/-/archive/v4.1.6/apparmor-v4.1.6.tar.gz
          tar -xzf apparmor-v4.1.6.tar.gz
          cd apparmor-v4.1.6

      - name: Build and Install libapparmor (Fully Static)
        run: |
          cd apparmor-v4.1.6/libraries/libapparmor
          ./autogen.sh
          # پیکربندی برای ساخت فقط کتابخانه استاتیک (بدون .so)
          ./configure --prefix=/usr --enable-static --disable-shared CFLAGS="-static" LDFLAGS="-static"
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build and Install apparmor_parser (Fully Static)
        run: |
          cd apparmor-v4.1.6/parser
          make clean
          # استفاده از فلگ -static برای لینک کامل استاتیک
          make -j$(nproc) LDFLAGS="-static -all-static" WITH_STATIC_LINKING=1
          sudo make install LDFLAGS="-static -all-static" WITH_STATIC_LINKING=1
          sudo ldconfig

      - name: Build and Install apparmor_utils
        run: |
          cd apparmor-v4.1.6/utils
          make clean
          make -j$(nproc) LDFLAGS="-static"
          sudo make install LDFLAGS="-static"
          sudo ldconfig

      - name: Package Output for Tiny Core
        run: |
          mkdir -p /tmp/apparmor-out
          sudo cp -a /usr/bin/aa-* /tmp/apparmor-out/ 2>/dev/null || true
          sudo cp -a /usr/sbin/apparmor_parser /tmp/apparmor-out/ 2>/dev/null || true
          sudo cp -a /usr/lib/libapparmor* /tmp/apparmor-out/ 2>/dev/null || true
          sudo cp -a /usr/share/apparmor /tmp/apparmor-out/ 2>/dev/null || true
          
          cd /tmp/apparmor-out
          tar -czf /tmp/apparmor-userspace-static.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apparmor-userspace-static
          path: /tmp/apparmor-userspace-static.tar.gz
