name: Build AyhanOS Ultimate Kernel (AppArmor, FS, Network, Storage)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc wget xz-utils cpio

      - name: Download Tiny Core Kernel Source and Config
        run: |
          set -e
          wget -q --timeout=60 --tries=3 http://repo.tinycorelinux.net/17.x/x86/release/src/kernel/linux-6.18.2-patched.tar.xz || \
          wget -q --timeout=60 --tries=3 http://repo.tinycorelinux.net/17.x/x86/release/src/kernel/linux-6.18.2.tar.xz
          
          wget -q --timeout=60 --tries=2 http://repo.tinycorelinux.net/17.x/x86/release/src/kernel/config-6.18.2-tinycore || true
          
          tar -xf linux-6.18.2*.tar.xz
          cd linux-6.18.2
          
          if [ -f "../config-6.18.2-tinycore" ]; then
            echo "Using downloaded config"
            cp ../config-6.18.2-tinycore .config
          else
            echo "Config not found, generating defconfig..."
            make defconfig
          fi
          
          make oldconfig < /dev/null

      - name: Enable All Kernel Features
        run: |
          cd linux-6.18.2
          
          # --- 1. امنیت و AppArmor ---
          scripts/config --enable CONFIG_SECURITY_APPARMOR
          scripts/config --enable CONFIG_SECURITY_APPARMOR_BOOTPARAM_VALUE
          scripts/config --set-str CONFIG_DEFAULT_SECURITY "apparmor"
          scripts/config --enable CONFIG_SECURITY
          scripts/config --enable CONFIG_SECURITY_NETWORK
          
          # --- 2. شبکه و مجازی‌سازی ---
          scripts/config --enable CONFIG_VIRTIO_NET
          scripts/config --enable CONFIG_NETDEVICES
          scripts/config --enable CONFIG_WIREGUARD
          scripts/config --enable CONFIG_NET_UDP_TUNNEL
          scripts/config --enable CONFIG_NET_FOU
          
          # --- 3. فایل‌سیستم‌ها (همه فرمت‌ها) ---
          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_EXT4_FS_POSIX_ACL
          scripts/config --enable CONFIG_EXT4_FS_SECURITY
          scripts/config --enable CONFIG_VFAT_FS
          scripts/config --enable CONFIG_NTFS3_FS
          scripts/config --enable CONFIG_EXFAT_FS
          scripts/config --enable CONFIG_FAT_FS
          scripts/config --enable CONFIG_MSDOS_FS
          scripts/config --enable CONFIG_ISO9660_FS
          scripts/config --enable CONFIG_SQUASHFS
          scripts/config --enable CONFIG_SQUASHFS_XZ
          scripts/config --enable CONFIG_SQUASHFS_LZO
          scripts/config --enable CONFIG_SQUASHFS_ZLIB
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --enable CONFIG_FUSE_FS
          
          # --- 4. حافظه و کارایی ---
          scripts/config --enable CONFIG_ZRAM
          scripts/config --enable CONFIG_ZSMALLOC
          scripts/config --enable CONFIG_ZRAM_WRITEBACK
          scripts/config --enable CONFIG_ZSWAP
          scripts/config --enable CONFIG_PREEMPT
          scripts/config --enable CONFIG_HZ_1000
          
          # --- 5. ذخیره‌سازی (USB, SATA, NVMe) ---
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_USB_SUPPORT
          scripts/config --enable CONFIG_USB_STORAGE
          scripts/config --enable CONFIG_USB_XHCI_HCD
          scripts/config --enable CONFIG_USB_EHCI_HCD
          scripts/config --enable CONFIG_ATA
          scripts/config --enable CONFIG_ATA_PIIX
          scripts/config --enable CONFIG_SATA_AHCI
          scripts/config --enable CONFIG_NVME_CORE
          scripts/config --enable CONFIG_BLK_DEV_NVME
          scripts/config --enable CONFIG_VIRTIO_BLK
          
          # --- 6. گرافیک پایه و کنسول ---
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          
          # اعمال تغییرات نهایی
          make olddefconfig
          
          # --- مرحله بررسی نهایی (تضمینی) ---
          echo "=== Final Configuration Check ==="
          echo "--- Security ---"
          grep "CONFIG_SECURITY_APPARMOR=" .config || echo "WARNING: AppArmor missing!"
          echo "--- Filesystems ---"
          grep "CONFIG_EXT4_FS=" .config || echo "WARNING: EXT4 missing!"
          grep "CONFIG_SQUASHFS=" .config || echo "WARNING: SquashFS missing!"
          grep "CONFIG_NTFS3_FS=" .config || echo "WARNING: NTFS3 missing!"
          echo "--- Storage ---"
          grep "CONFIG_VIRTIO_BLK=" .config || echo "WARNING: VirtIO Block missing!"
          grep "CONFIG_ATA_PIIX=" .config || echo "WARNING: ATA PIIX missing!"
          echo "--- Network ---"
          grep "CONFIG_VIRTIO_NET=" .config || echo "WARNING: VirtIO Net missing!"
          grep "CONFIG_WIREGUARD=" .config || echo "WARNING: WireGuard missing!"
          echo "--- Memory ---"
          grep "CONFIG_ZRAM=" .config || echo "WARNING: ZRAM missing!"

      - name: Compile Kernel
        run: |
          cd linux-6.18.2
          make -j$(nproc) bzImage
          make -j$(nproc) modules

      - name: Package Output for Tiny Core
        run: |
          cd linux-6.18.2
          cp arch/x86/boot/bzImage ../vmlinuz-ultimate
          
          mkdir -p ../modules_out
          make INSTALL_MOD_PATH=../modules_out modules_install
          
          KERNEL_VERSION=$(make kernelrelease)
          echo "Kernel Version is: $KERNEL_VERSION"
          
          cd ../modules_out/lib/modules/$KERNEL_VERSION
          find . -name "*.ko" -exec gzip -9 {} \;
          ln -sf kernel kernel.tclocal
          
          cd ..
          depmod -b ../.. $KERNEL_VERSION
          
          tar -czf ../../../../modules-ultimate.tar.gz -C $KERNEL_VERSION .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ayhanos-ultimate-kernel
          path: |
            vmlinuz-ultimate
            modules-ultimate.tar.gz
