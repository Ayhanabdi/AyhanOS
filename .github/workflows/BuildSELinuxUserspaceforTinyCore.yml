name: Build SELinux Userspace for Tiny Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libaudit-dev libbz2-dev libcap-dev libcap-ng-dev libpcre2-dev libsepol-dev libselinux-dev python3-dev swig pkg-config gettext xmlto

      - name: Download SELinux Userspace Source
        run: |
          # دریافت آخرین نسخه پایدار از مخزن رسمی SELinuxProject
          wget -q https://github.com/SELinuxProject/selinux/releases/download/3.7/selinux-3.7.tar.gz
          tar -xzf selinux-3.7.tar.gz
          cd selinux-3.7

      - name: Build and Install libsepol
        run: |
          cd selinux-3.7/libsepol
          make clean
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build and Install libselinux
        run: |
          cd selinux-3.7/libselinux
          make clean
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build and Install checkpolicy
        run: |
          cd selinux-3.7/checkpolicy
          make clean
          make -j$(nproc)
          sudo make install

      - name: Build and Install policycoreutils
        run: |
          cd selinux-3.7/policycoreutils
          make clean
          make -j$(nproc)
          sudo make install

      - name: Package Output for Tiny Core
        run: |
          # جمع‌آوری فایل‌های نصب شده در یک پوشه موقت
          mkdir -p /tmp/selinux-out
          sudo cp -a /usr/local/bin /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/sbin /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/lib /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/include /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/share /tmp/selinux-out/ 2>/dev/null || true
          
          # ساخت آرشیو نهایی
          cd /tmp/selinux-out
          tar -czf /tmp/selinux-userspace-tinycore.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selinux-userspace
          path: /tmp/selinux-userspace-tinycore.tar.gz
