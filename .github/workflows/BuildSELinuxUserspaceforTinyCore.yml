name: Build SELinux Userspace Static for Tiny Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libaudit-dev libbz2-dev libcap-dev libcap-ng-dev libpcre2-dev libsepol-dev libselinux-dev python3-dev swig pkg-config gettext xmlto

      - name: Download SELinux Userspace Source
        run: |
          wget -q https://github.com/SELinuxProject/selinux/releases/download/3.7/selinux-3.7.tar.gz
          tar -xzf selinux-3.7.tar.gz

      - name: Build and Install libsepol (Static)
        run: |
          cd selinux-3.7/libsepol
          make clean
          make -j$(nproc) DISABLE_SHARED=y
          sudo make install DISABLE_SHARED=y
          sudo ldconfig

      - name: Build and Install libselinux (Static)
        run: |
          cd selinux-3.7/libselinux
          make clean
          make -j$(nproc) DISABLE_SHARED=y PKG_CONFIG="pkg-config --static"
          sudo make install DISABLE_SHARED=y PKG_CONFIG="pkg-config --static"
          sudo ldconfig

      - name: Build and Install checkpolicy (Static)
        run: |
          cd selinux-3.7/checkpolicy
          make clean
          make -j$(nproc) DISABLE_SHARED=y PKG_CONFIG="pkg-config --static"
          sudo make install DISABLE_SHARED=y PKG_CONFIG="pkg-config --static"

      - name: Build and Install policycoreutils (Static)
        run: |
          cd selinux-3.7/policycoreutils
          make clean
          # نکته کلیدی: PKG_CONFIG با --static تا وابستگی‌های خصوصی (libpcre2) هم لینک شوند
          make -j$(nproc) DISABLE_SHARED=y PKG_CONFIG="pkg-config --static" LIBDIR=/usr/local/lib SHLIBDIR=/usr/local/lib
          sudo make install DISABLE_SHARED=y PKG_CONFIG="pkg-config --static" LIBDIR=/usr/local/lib SHLIBDIR=/usr/local/lib
          sudo ldconfig

      - name: Package Output for Tiny Core
        run: |
          mkdir -p /tmp/selinux-out
          sudo cp -a /usr/local/bin /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/sbin /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/lib /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/include /tmp/selinux-out/ 2>/dev/null || true
          sudo cp -a /usr/local/share /tmp/selinux-out/ 2>/dev/null || true
          
          cd /tmp/selinux-out
          tar -czf /tmp/selinux-userspace-static-tinycore.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selinux-userspace-static
          path: /tmp/selinux-userspace-static-tinycore.tar.gz
